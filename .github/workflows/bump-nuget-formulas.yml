name: bump-nuget-formulas

# Keeps NuGet-backed formulas in sync with the latest stable package version.
# Runs on a schedule so no cross-repository token is needed.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bump-nuget-formulas
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump id6-mail-mcp from NuGet
        run: |
          set -euo pipefail
          tool="id6-mail-mcp"
          package="jefftian.id6mail.mcp"
          formula="Formula/$tool.rb"

          index="$(mktemp)"
          if ! curl -fsSL "https://api.nuget.org/v3-flatcontainer/$package/index.json" -o "$index"; then
            echo "::notice::$package is not on NuGet yet — retrying next run"
            exit 0
          fi

          latest="$(jq -r '.versions[]' "$index" | grep -v -- '-' | sort -V | tail -1)"
          if [ -z "$latest" ]; then
            echo "::error::No stable version found for $package"
            exit 1
          fi

          current="$(sed -n 's/^  version "\([^"]*\)"$/\1/p' "$formula")"
          if [ -z "$current" ]; then
            echo "::error::No version found in $formula"
            exit 1
          fi

          if [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)" = "$current" ]; then
            echo "$tool is up to date ($current)"
            exit 0
          fi

          pkg="$(mktemp --suffix=.nupkg)"
          curl -fsSL "https://api.nuget.org/v3-flatcontainer/$package/$latest/$package.$latest.nupkg" -o "$pkg"
          sha="$(sha256sum "$pkg" | cut -d' ' -f1)"

          sed -i \
            -e "s|^  version \".*\"$|  version \"$latest\"|" \
            -e "s|^  url \".*$|  url \"https://api.nuget.org/v3-flatcontainer/$package/$latest/$package.$latest.nupkg\",|" \
            -e "s|^  sha256 \".*\"$|  sha256 \"$sha\"|" \
            "$formula"

          grep -q "  version \"$latest\"" "$formula"
          grep -q "  sha256 \"$sha\"" "$formula"
          grep -q "/$latest/" "$formula"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$formula"
          git commit -m "📦️ build($tool): bump to $latest"
          git push
